<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Bamboo New Tab</title>
  <link rel="stylesheet" href="bamboo_newtab.css">
  <link rel="icon" href="icons/icon48.png">
  <!-- Preconnect to Google Fonts for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

  <div class="main-container">
    <!-- Google Style Search Bar -->
    <div class="search-wrapper">
      <div class="search-bar">
        <div class="engine-selector" id="engineSelector" title="Switch Search Engine">
          <img id="currentEngineIcon" src="" alt="Engine">
        </div>
        <input type="text" id="searchInput" placeholder="Search Google or type a URL">
        <div class="search-icon-action">
          <svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path
              d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z">
            </path>
          </svg>
        </div>
      </div>

      <!-- Engine Dropdown (Hidden by default) -->
      <div class="engine-dropdown hidden" id="engineDropdown">
        <div class="engine-option" data-engine="google">
          <img src="https://www.google.com/favicon.ico" alt="Google">
          <span>Google</span>
        </div>
        <div class="engine-option" data-engine="bing">
          <img src="https://www.bing.com/favicon.ico" alt="Bing">
          <span>Bing</span>
        </div>
        <div class="engine-option" data-engine="duckduckgo">
          <img src="https://duckduckgo.com/favicon.ico" alt="DuckDuckGo">
          <span>DuckDuckGo</span>
        </div>
      </div>
    </div>

    <div class="app-grid" id="appGrid">
      <!-- Shortcuts will be populated by JS -->
    </div>
  </div>

  <!-- Edit Shortcut Modal -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal-content">
      <h3 id="modalTitle">Edit Shortcut</h3>
      <div class="form-group">
        <label for="shortcutName">Name</label>
        <input type="text" id="shortcutName" placeholder="My Site">
      </div>
      <div class="form-group">
        <label for="shortcutUrl">URL</label>
        <input type="text" id="shortcutUrl" placeholder="https://example.com">
      </div>
      <div class="form-group">
        <label for="shortcutIcon">Icon URL (Optional)</label>
        <input type="text" id="shortcutIcon" placeholder="https://example.com/favicon.ico">
      </div>
      <div class="modal-actions">
        <button id="modalRemoveBtn" class="btn-remove hidden">Remove</button>
        <div class="right-actions">
          <button id="modalCancelBtn" class="btn-cancel">Cancel</button>
          <button id="modalSaveBtn" class="btn-save">Done</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Transparent Overlay for Context Menu -->
  <div id="menuOverlay" class="menu-overlay hidden"></div>

  <!-- Action Menu (Context Menu) -->
  <div id="actionMenu" class="action-menu hidden">
    <div class="action-menu-item" id="menuEditBtn">Edit</div>
    <div class="action-menu-item danger" id="menuRemoveBtn">Remove</div>
  </div>

  <!-- Confirmation Modal -->
  <div id="confirmModal" class="modal-overlay hidden">
    <div class="modal-content" style="max-width: 320px;">
      <h3>Delete Shortcut?</h3>
      <p style="color: #5f6368; font-size: 14px; margin-bottom: 24px;">
        Are you sure you want to remove this shortcut? This action cannot be undone.
      </p>
      <div class="modal-actions">
        <div class="right-actions" style="margin-left: auto; width: 100%; display: flex; justify-content: flex-end; gap: 12px;">
          <button id="confirmCancelBtn" class="btn-cancel">Cancel</button>
          <button id="confirmDeleteBtn" class="btn-remove" style="border: none; background: #d93025; color: white;">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="bamboo_newtab.js"></script>
</body>

</html>
